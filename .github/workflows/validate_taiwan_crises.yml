name: Taiwan Macro Crisis Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements_macro_validation.txt

      - name: Fetch latest Taiwan official data
        run: python fetch_taiwan_full.py

      - name: Run crisis and false-alarm validation
        run: python validate_taiwan_crises.py

      - name: Show decision ranking
        run: |
          echo "===== Crisis / Investment Decision Ranking ====="
          cat data/processed/taiwan_bottom_reentry.csv

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-macro-crisis-validation
          path: |
            data/processed/taiwan_crisis_validation.csv
            data/processed/taiwan_false_alarm_summary.csv
            data/processed/taiwan_bottom_reentry.csv
          retention-days: 30
