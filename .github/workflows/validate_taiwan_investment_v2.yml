name: Taiwan Macro Investment Validation V2

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements_macro_validation.txt

      - name: Fetch latest Taiwan official data
        run: python fetch_taiwan_full.py

      - name: Run investment validation V2
        run: python validate_taiwan_investment_v2.py

      - name: Show V2 final ranking
        run: |
          echo "===== V2 FINAL RANKING ====="
          cat data/processed/v2_final_ranking.csv

      - name: Upload V2 validation results
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-macro-investment-validation-v2
          path: |
            data/processed/v2_model_grid.csv
            data/processed/v2_drawdown_events.csv
            data/processed/v2_event_capture.csv
            data/processed/v2_false_alarms.csv
            data/processed/v2_deep_bear_forward_returns.csv
            data/processed/v2_strategy_metrics.csv
            data/processed/v2_final_ranking.csv
          retention-days: 30
