name: Taiwan Macro Robustness Validation V3.1

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements_macro_validation.txt

      - name: Fetch latest Taiwan official data
        run: python fetch_taiwan_full.py

      - name: Rebuild V3 source outputs
        run: python validate_taiwan_investment_v3.py

      - name: Run V3.1 robustness validation
        run: python validate_taiwan_robustness_v31.py

      - name: Show V3.1 robustness result
        run: |
          echo "===== V3.1 FINAL ROBUSTNESS ====="
          cat data/processed/v31_final_robustness.csv

      - name: Upload V3.1 validation results
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-macro-robustness-validation-v31
          path: |
            data/processed/v31_crisis_tagged_samples.csv
            data/processed/v31_rule_summary.csv
            data/processed/v31_leave_one_crisis_out.csv
            data/processed/v31_bootstrap_summary.csv
            data/processed/v31_final_robustness.csv
          retention-days: 30
