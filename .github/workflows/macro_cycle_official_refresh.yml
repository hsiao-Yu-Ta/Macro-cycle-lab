name: Macro Cycle Lab Official Refresh

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements_macro_validation.txt
          pip install streamlit

      - name: Fetch latest Taiwan official data
        run: python fetch_taiwan_full.py

      - name: Verify integrated official model
        run: |
          python - <<'PY'
          from src.taiwan_decision_engine import build_official_history, latest_signal

          h = build_official_history(
              "data/processed/taiwan_macro_inputs.csv",
              "data/raw/ndc_business_cycle.xlsx"
          )

          s = latest_signal(h)

          print("Macro date:", s["date"])
          print("Regime:", s["macro_regime"])
          print("Action:", s["action_label_zh"])
          print("Confidence:", s["confidence"])
          print(
              "Suggested tranche:",
              s["suggested_tranche_pct_of_remaining_reserve"],
              "%"
          )
          PY

      - name: Upload refreshed data
        uses: actions/upload-artifact@v4
        with:
          name: macro-cycle-lab-official-refresh
          path: |
            data/processed/taiwan_macro_inputs.csv
          retention-days: 30
