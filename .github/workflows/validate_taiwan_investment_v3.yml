name: Taiwan Macro Investment Validation V3

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements_macro_validation.txt

      - name: Fetch latest Taiwan official data
        run: python fetch_taiwan_full.py

      - name: Run investment validation V3
        run: python validate_taiwan_investment_v3.py

      - name: Show V3 results
        run: |
          echo "===== V3 FINAL SUMMARY ====="
          cat data/processed/v3_final_summary.csv
          echo ""
          echo "===== V3 DEEP BEAR SUMMARY ====="
          cat data/processed/v3_deep_bear_summary.csv

      - name: Upload V3 validation results
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-macro-investment-validation-v3
          path: |
            data/processed/v3_local_cycles.csv
            data/processed/v3_model_event_comparison.csv
            data/processed/v3_macro_drawdown_matrix.csv
            data/processed/v3_macro_drawdown_samples.csv
            data/processed/v3_deep_bear_summary.csv
            data/processed/v3_final_summary.csv
          retention-days: 30
