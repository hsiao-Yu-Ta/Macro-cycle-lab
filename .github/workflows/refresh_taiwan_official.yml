name: Taiwan Macro Official Refresh

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements_macro_validation.txt
          pip install streamlit

      - name: Fetch latest Taiwan official data
        run: python fetch_taiwan_full.py

      - name: Build official signal
        run: python run_taiwan_official.py

      - name: Show official signal
        run: |
          echo "===== TAIWAN OFFICIAL SIGNAL ====="
          cat data/processed/taiwan_official_signal.csv

      - name: Upload official outputs
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-macro-official-signal
          path: |
            data/processed/taiwan_macro_inputs.csv
            data/processed/taiwan_official_signal.csv
            data/processed/taiwan_official_history.csv
          retention-days: 30
